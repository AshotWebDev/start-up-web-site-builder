services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitebuilder_db
      POSTGRES_USER: vardan1444
      POSTGRES_PASSWORD: Zibilanoc3!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

#  redis:
#    image: redis:7-alpine
#    ports:
#      - "6379:6379"
#    restart: unless-stopped

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=sitebuilder_db
      - POSTGRES_USER=vardan1444
      - POSTGRES_PASSWORD=Zibilanoc3!
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
#      - redis
    restart: unless-stopped

#  celery:
#    build: .
#    command: celery -A backend worker -l info
#    volumes:
#      - .:/backend
#      - /var/run/docker.sock:/var/run/docker.sock
#    environment:
#      - POSTGRES_DB=sitebuilder_db
#      - POSTGRES_USER=vardan1444
#      - POSTGRES_PASSWORD=Zibilanoc3!
#      - POSTGRES_HOST=db
#      - POSTGRES_PORT=5432
#      - CELERY_BROKER_URL=redis://redis:6379/0
#      - CELERY_RESULT_BACKEND=redis://redis:6379/0
#      - DOCKER_HOST=unix:///var/run/docker.sock
#    depends_on:
#      - db
#      - redis
#    restart: unless-stopped

  # ==================== НОВЫЙ СЕРВИС ФРОНТЕНД ====================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - ../frontend:/app
      - /app/node_modules                  # чтобы node_modules не перезаписывался
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://web:8000/api/v1
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data: